[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialoguematch"
version = "2.0.0"
description = "Local, evidence-backed movie dialogue and scene retrieval engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
    "torch>=2.2,<3",
    "faiss-cpu>=1.8,<2",
    "rapidfuzz>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
dialoguematch = "dialoguematch.__main__:main"

[tool.setuptools.packages.find]
include = ["dialoguematch*"]

[tool.setuptools.package-data]
dialoguematch = ["web.html", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:html", "-p", "no:metadata", "-p", "no:seleniumbase"]
filterwarnings = [
    "ignore:builtin type SwigPy.*:DeprecationWarning",
    "ignore:builtin type swigvarlink.*:DeprecationWarning",
]
